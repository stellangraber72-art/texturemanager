name: Build Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Neueste Fabric-Versionen für 1.21.11 eintragen
        run: |
          API=$(curl -sG -A "texturemanager-build" "https://api.modrinth.com/v2/project/fabric-api/version" \
            --data-urlencode 'game_versions=["1.21.11"]' --data-urlencode 'loaders=["fabric"]' | jq -r '.[0].version_number')
          LOADER=$(curl -s https://meta.fabricmc.net/v2/versions/loader | jq -r '[.[] | select(.stable==true)][0].version')
          echo "Fabric API: $API / Loader: $LOADER"
          sed -i "s|^fabric_version=.*|fabric_version=$API|" gradle.properties
          sed -i "s|^loader_version=.*|loader_version=$LOADER|" gradle.properties
          cat gradle.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Bauen
        run: gradle build --stacktrace

      - name: Sources-Jar entfernen
        run: rm -f build/libs/*-sources.jar

      - uses: actions/upload-artifact@v4
        with:
          name: texturemanager-mod
          path: build/libs/*.jar
